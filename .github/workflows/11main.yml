name: Biên dịch Tweak Fake Camera Wincare (macOS)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    # Chuyển sang sử dụng máy ảo Mac
    runs-on: macos-latest

    steps:
      - name: Set up job
        uses: actions/checkout@v4

      - name: Thiết lập Theos và Môi trường
        run: |
          # Tải và cài đặt Theos chuẩn
          bash -c "$(curl -fsSL https://githubusercontent.com)"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Liên kết iOS SDK từ Xcode
        run: |
          # Tạo thư mục chứa SDK trong Theos
          mkdir -p $HOME/theos/sdks
          
          # Lấy trực tiếp SDK iPhoneOS mặc định của Xcode có sẵn trên máy ảo Mac
          # và tạo một liên kết (symlink) vào thư mục sdks của Theos
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          ln -s "$SDK_PATH" $HOME/theos/sdks/iPhoneOS.sdk
          
          echo "Đã liên kết SDK từ đường dẫn: $SDK_PATH"

      - name: Tiến hành Biên dịch Tweak
        run: |
          export THEOS=$HOME/theos
          # Biên dịch Tweak với kiến trúc arm64 và arm64e
          make package FINALPACKAGE=1 SHARED_ARCHS="arm64 arm64e"

      - name: Lưu trữ file dylib / deb kết quả
        uses: actions/upload-artifact@v4
        with:
          name: Fake-Camera-Wincare-Mac-Output
          path: |
            *.deb
            .theos/obj/*.dylib
