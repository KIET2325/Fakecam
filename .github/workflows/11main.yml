name: Biên dịch Tweak Fake Camera Wincare

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập môi trường Linux và Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync curl git coreutils build-essential checkinstall dynamiclist libsecurity-mac-perlio-perl
          bash -c "$(curl -fsSL https://githubusercontent.com)"
          echo "THEOS=/home/runner/theos" >> $GITHUB_ENV

      - name: Tải iOS SDK
        run: |
          # Sửa lỗi đường dẫn có dấu ngã (~) bị lỗi 128 trước đó
          git clone https://github.com /home/runner/theos/sdks

      - name: Tiến hành Biên dịch Tweak
        run: |
          export THEOS=/home/runner/theos
          export PATH=$THEOS/bin:$PATH
          make clean
          make package FINALPACKAGE=1

      - name: Lưu trữ file dylib / deb kết quả
        uses: actions/artifacts@v4
        with:
          name: Wincare-FakeCam-Tweak
          path: |
            .theos/obj/debug/*.dylib
            packages/*.deb
