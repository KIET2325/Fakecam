name: Biên dịch Tweak Fake Camera Wincare (macOS)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Set up job
        uses: actions/checkout@v4

      - name: Thiết lập Theos và Môi trường
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Cài đặt công cụ ký số ldid
        run: |
          # Cài đặt ldid từ Homebrew để xử lý lỗi Signing ldid: command not found
          brew install ldid
        
      - name: Liên kết iOS SDK từ Xcode
        run: |
          mkdir -p $HOME/theos/sdks
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          ln -s "$SDK_PATH" $HOME/theos/sdks/iPhoneOS.sdk
          echo "Đã liên kết SDK từ đường dẫn: $SDK_PATH"

      - name: Tiến hành Biên dịch Tweak
        run: |
          export THEOS=$HOME/theos
          make package FINALPACKAGE=1 SHARED_ARCHS="arm64 arm64e"

      - name: Lưu trữ file dylib / deb kết quả
        uses: actions/upload-artifact@v4
        with:
          name: Fake-Camera-Wincare-Mac-Output
          path: |
            *.deb
            packages/*.deb
            .theos/obj/*.dylib
            **/*.dylib
