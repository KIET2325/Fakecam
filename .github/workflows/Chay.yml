name: Biên dịch Tweak Fake Camera Wincare

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up job
        uses: actions/checkout@v4

      - name: Thiết lập môi trường Linux và Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot git make curl build-essential libssl-dev standard-version unzip
          bash -c "$(curl -fsSL https://githubusercontent.com)"
          echo "THEOS=/home/runner/theos" >> $GITHUB_ENV

      - name: Tải iOS SDK
        run: |
          mkdir -p /home/runner/theos/sdks
          # Tải SDK iOS 14.5 chuẩn cho Theos (bạn có thể đổi sang bản khác nếu cần)
          curl -LO https://github.com
          tar -xf iPhoneOS14.5.sdk.tar.xz -C /home/runner/theos/sdks/
          rm iPhoneOS14.5.sdk.tar.xz

      - name: Tiến hành Biên dịch Tweak
        run: |
          export THEOS=/home/runner/theos
          # Lệnh make sẽ tự động build ra cả file .deb và file .dylib trong thư mục .theos/obj/
          make package FINALPACKAGE=1 SHARED_ARCHS="arm64 arm64e"

      - name: Lưu trữ file dylib / deb kết quả
        uses: actions/artifacts@v4
        with:
          name: Fake-Camera-Wincare-Output
          path: |
            *.deb
            .theos/obj/*.dylib
